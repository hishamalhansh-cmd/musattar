<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<title>المسطر</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:#0d0d0d;
color:white;
text-align:center;
}

.container{
margin-top:100px;
}

.logo{
width:140px;
height:140px;
border-radius:25px;
box-shadow:0 0 25px gold;
}

h1{
color:#FFD700;
font-size:42px;
margin-top:20px;
}

p{
font-size:20px;
color:#ddd;
}

button{
background:linear-gradient(45deg,#FFD700,#b8860b);
border:none;
padding:15px 40px;
font-size:20px;
border-radius:15px;
cursor:pointer;
color:black;
font-weight:bold;
margin-top:20px;
box-shadow:0 0 20px rgba(255,215,0,.6);
}

button:hover{
transform:scale(1.05);
}

.card{
width:90%;
max-width:700px;
margin:auto;
padding:30px;
background:#1a1a1a;
border-radius:25px;
box-shadow:0 0 20px rgba(255,215,0,.2);
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<img src="https://play-lh.googleusercontent.com/" class="logo">

<h1>المسطر</h1>

<p>
منصة للعمل والخدمات في العراق
</p>

<button>
عرض الأعمال
</button>

</div>

</div>

</body>

</html>
